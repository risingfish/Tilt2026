<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tilt</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        color: #ddd;
        font-family: -moz-fixed, monospace;
        font-size: 12px;
      }
      #tilt-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #tilt-status {
        position: absolute;
        top: 8px;
        left: 8px;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid #333;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="tilt-canvas"></canvas>
    <div id="tilt-status">Tilt: waiting for inspected tab...</div>
    <script src="chrome-shim.js"></script>
    <script src="Tilt-engine.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
