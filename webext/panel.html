<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tilt</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        color: #ddd;
        font-family: -moz-fixed, monospace;
        font-size: 12px;
      }
      #tilt-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #tilt-status {
        position: absolute;
        top: 8px;
        left: 8px;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid #333;
        pointer-events: none;
      }
      #tilt-refresh, #tilt-reset, #tilt-show-hidden {
        position: absolute;
        left: 8px;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid #333;
        color: #ddd;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
      }
      #tilt-refresh      { top: 36px; }
      #tilt-reset        { top: 64px; }
      #tilt-show-hidden  { top: 92px; }
      #tilt-show-hidden[aria-pressed="true"] {
        background: rgba(60, 50, 20, 0.9);
        border-color: #ffcc33;
        color: #ffcc33;
      }
      #tilt-refresh:hover, #tilt-reset:hover, #tilt-show-hidden:hover {
        background: rgba(30, 30, 40, 0.9);
        border-color: #555;
      }
      #tilt-refresh:disabled, #tilt-reset:disabled, #tilt-show-hidden:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #tilt-source-view {
        position: absolute;
        right: 8px;
        top: 8px;
        bottom: 8px;
        width: 45%;
        min-width: 320px;
        display: flex;
        flex-direction: column;
        background: rgba(10, 10, 14, 0.95);
        border: 1px solid #444;
        border-radius: 3px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      }
      #tilt-source-view[hidden] {
        display: none;
      }
      .tilt-source-header {
        display: flex;
        align-items: center;
        padding: 6px 8px;
        background: #1c1c22;
        border-bottom: 1px solid #333;
      }
      #tilt-source-title {
        flex: 1;
        color: #9cf;
      }
      #tilt-source-close {
        background: transparent;
        border: none;
        color: #ccc;
        font-size: 16px;
        cursor: pointer;
        padding: 0 6px;
      }
      #tilt-source-close:hover {
        color: #fff;
      }
      #tilt-source-body {
        margin: 0;
        padding: 8px;
        flex: 1;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 11px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <canvas id="tilt-canvas"></canvas>
    <div id="tilt-status">Tilt: waiting for inspected tab...</div>
    <button id="tilt-refresh" title="Re-walk DOM (R)" disabled>↻ Refresh</button>
    <button id="tilt-reset" title="Reset view (Home)">⌂ Reset view</button>
    <button id="tilt-show-hidden" title="Toggle display of hidden elements" aria-pressed="false">◌ Show hidden</button>
    <div id="tilt-source-view" hidden>
      <div class="tilt-source-header">
        <span id="tilt-source-title"></span>
        <button id="tilt-source-close" title="Close (Esc)">×</button>
      </div>
      <pre id="tilt-source-body"></pre>
    </div>
    <script src="Tilt-engine.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
